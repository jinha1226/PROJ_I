name: Test and deploy playable MVP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tactics/package-lock.json
            party/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test:coverage
      - name: Board tactics prototype — install, type-check, tests
        working-directory: tactics
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Party combat prototype — install, type-check
        working-directory: party
        run: |
          npm ci
          npm run typecheck
      - name: Dungeon settlers prototype — headless sim + balance smoke
        working-directory: settlers
        run: |
          node test/sim.js 3 2
          node test/balance.js 1 10 --seed=1

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tactics/package-lock.json
            party/package-lock.json
      - run: npm ci
      - name: Download CC0 KayKit character models
        run: python3 -I scripts/fetch-assets.py --dungeon
      - name: Build
        run: npm run build
      - name: Build board tactics prototype into dist/tactics
        working-directory: tactics
        run: |
          npm ci
          npx vite build --outDir ../dist/tactics --emptyOutDir
      - name: Build party combat prototype into dist/party
        working-directory: party
        run: |
          npm ci
          npx vite build --outDir ../dist/party --emptyOutDir
      - name: Copy dungeon settlers prototype into dist/settlers
        run: |
          mkdir -p dist/settlers
          cp -r settlers/index.html settlers/style.css settlers/js settlers/assets dist/settlers/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
