name: Test and deploy playable MVP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MVP checks
        run: node --experimental-vm-modules --test tests/*.test.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Fetch CC0 KayKit character models
        run: |
          python - <<'PY'
          import io, pathlib, urllib.request, zipfile, shutil
          url='https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/archive/refs/heads/main.zip'
          archive=zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url,timeout=90).read()))
          files=[n for n in archive.namelist() if n.lower().endswith('.glb')]
          out=pathlib.Path('assets/kaykit');out.mkdir(parents=True,exist_ok=True)
          for name in ('Knight','Rogue','Mage'):
              matches=[p for p in files if pathlib.PurePosixPath(p).stem.lower()==name.lower()]
              if not matches:
                  print(f'KayKit {name} GLB not found; fallback will be used.')
                  continue
              with archive.open(matches[0]) as src,(out/(name+'.glb')).open('wb') as dst:
                  shutil.copyfileobj(src,dst)
              print('Downloaded',matches[0])
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
