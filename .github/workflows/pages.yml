name: Test and deploy playable MVP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MVP checks
        run: node --experimental-vm-modules --test tests/*.test.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install actual KayKit CC0 character and dungeon GLBs
        run: |
          python - <<'PY'
          import io, pathlib, urllib.request, zipfile, shutil
          sources = {
            'adventurers': 'KayKit-Character-Pack-Adventures-1.0',
            'skeletons': 'KayKit-Character-Pack-Skeletons-1.0',
            'dungeon': 'KayKit-Dungeon-Remastered-1.0',
          }
          selected = {
            'adventurers': ['Knight','Rogue_Hooded','Mage'],
            'skeletons': ['Skeleton_Warrior','Skeleton_Mage'],
          }
          root=pathlib.Path('assets/kaykit')
          root.mkdir(parents=True,exist_ok=True)
          manifest={}
          for kind,repo in sources.items():
            url=f'https://github.com/KayKit-Game-Assets/{repo}/archive/refs/heads/main.zip'
            print('Downloading',url,flush=True)
            request=urllib.request.Request(url,headers={'User-Agent':'PROJ-I-build'})
            with urllib.request.urlopen(request,timeout=120) as response:
              archive=zipfile.ZipFile(io.BytesIO(response.read()))
            glbs=[p for p in archive.namelist() if p.lower().endswith('.glb')]
            if kind=='dungeon':
              candidates=[p for p in glbs if '/gltf/' in p.lower()]
              if not candidates: candidates=glbs
              names=['floor','wall','pillar','torch','chest','barrel','crate']
              for token in names:
                matches=[p for p in candidates if token in pathlib.PurePosixPath(p).stem.lower()]
                if not matches: continue
                matches.sort(key=lambda p:(len(pathlib.PurePosixPath(p).stem),len(p)))
                src=matches[0];dst=root/('dungeon_'+token+'.glb')
                with archive.open(src) as f,dst.open('wb') as o: shutil.copyfileobj(f,o)
                manifest['dungeon_'+token]=str(dst)
            else:
              for name in selected[kind]:
                matches=[p for p in glbs if pathlib.PurePosixPath(p).stem.lower()==name.lower()]
                if not matches:
                  print('Available GLB names:',[pathlib.PurePosixPath(p).stem for p in glbs[:30]])
                  raise RuntimeError(f'Missing KayKit {name} in {repo}')
                src=matches[0];dst=root/(name+'.glb')
                with archive.open(src) as f,dst.open('wb') as o: shutil.copyfileobj(f,o)
                manifest[name]=str(dst)
          required=['Knight','Rogue_Hooded','Mage','Skeleton_Warrior','Skeleton_Mage']
          missing=[name for name in required if name not in manifest]
          if missing: raise RuntimeError(f'Missing required KayKit files: {missing}')
          if not any(k.startswith('dungeon_') for k in manifest): raise RuntimeError('No KayKit dungeon models found')
          print('KayKit assets:',manifest)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
