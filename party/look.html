<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>3D 룩 테스트</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a10; color: #eee; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    #ui { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    button { background: #1c1b26ee; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 13px; }
    button.on { border-color: #ffcc66; color: #ffcc66; }
    #fps { font-size: 12px; color: #9f9; background: #000a; padding: 3px 7px; border-radius: 5px; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">에셋 불러오는 중…</div>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <script type="module" src="/src/look/main.ts"></script>
</body>
</html>
