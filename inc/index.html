<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>용병단</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="top"><span id="round"></span><span id="danger"></span><span id="order"></span><span id="turninfo"></span></div>
  <div id="stage"><canvas id="c"></canvas><div id="floats"></div>
    <div id="roll" class="hidden"><canvas id="die" width="44" height="44"></canvas><div><small class="h"></small><b class="w"></b><div class="a"></div></div></div>
    <div id="dm" class="hidden"></div>
    <div id="ask" class="hidden"><h3></h3><div class="opts"></div><div class="bar"></div></div>
  </div>
  <div id="brief" class="hidden"></div>
  <div id="party"></div>
  <div id="fboard" class="hidden"></div>
  <div id="glog"></div>
</div>
<div id="fps"></div>
<script>
  // 개발 중: 옛 파일이 캐시에 남아 코드가 어긋나지 않게 매번 새로 받는다
  const VER = Date.now();
  // 파일을 직접 열면 브라우저가 그림 읽기를 막아 화면이 나오지 않는다
  if (location.protocol === 'file:') document.write('<div style="position:fixed;inset:0;z-index:99;background:#17151c;color:#ece4d4;display:flex;align-items:center;justify-content:center;font:18px sans-serif">http://localhost:8765/ 로 열어 주세요</div>');
  for (const n of ['core','data','srd_gen','srd_base','srd_mons','grid','juice','season','fantasy','guild','create','persona','dnd','feats','trinkets','bonds','report','skills','srd','srd_spells','srd_upcast','spells','traits','options','pools','utilspell','srd_species','multiclass','srd_range','srd_items','items','skill_ai','team','camp','skill_fx','events','npc','tutorial','skill_nums','command','expedition','mission','explore','banter','lines_danger','sight','tactics','foe','summon','light','monact', 'actions', 'lore','region','scn_astral','tut_map','res','turn','flow','story','state'])
    document.write(`<script src="js/${n}.js?v=${VER}"><\/script>`);
</script>
<script src="js/artset.js"></script>
<script src="assets/dcss/map.js"></script>
<script src="js/iso/pixelfx/pixelfx.bundle.js"></script>
<script src="js/paperdoll.js"></script>
<!-- 파일 사이에서 최상위 이름을 공유한다: 순서가 곧 의존 순서 -->
<script>for (const n of ['core','models','bake','sprites','minidoll','game','fxlayer','pfx','vfx','hdbg','dice','actors','props','sheet','town','hud','cmdui','codex','war','create','main']) document.write(`<script src="js/iso/${n}.js?v=${VER}"><\/script>`);</script>
</body>
</html>
