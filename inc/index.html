<!doctype html>
<html lang="ko">
<head><script>/* 불러오는 동안의 오류(문법 오류 · 없는 이름)도 남긴다 — boot.js의 오류 표시보다 먼저 (page_smoke가 본다) */addEventListener('error', e => { const d = document.documentElement; d.dataset.loadErr = (d.dataset.loadErr ? d.dataset.loadErr + ' | ' : '') + (e.message || '') + ' @' + (e.filename || '').split('/').pop().split('?')[0] + ':' + e.lineno; });</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>심연 탐사대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css"><!-- 새 게임 화면 틀 (모바일 우선 · 넓은 화면은 미디어 쿼리) -->
</head>
<body>
<div id="wrap">
  <div id="top"><span id="round"></span><span id="danger"></span><span id="order"></span><span id="turninfo"></span></div>
  <div id="stage"><canvas id="c"></canvas><div id="floats"></div><div id="pmapbox" title="지도 (M)"><svg id="pmap" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="roll" class="hidden"><canvas id="die" width="44" height="44"></canvas><div><small class="h"></small><b class="w"></b><div class="a"></div></div></div>
    <div id="dm" class="hidden"></div>
    <div id="ask" class="hidden"><h3></h3><div class="opts"></div><div class="bar"></div></div>
  </div>
  <div id="brief" class="hidden"></div>
  <div id="party"></div>
  <div id="fboard" class="hidden"></div>
  <div id="glog"></div>
</div>
<div id="fps"></div>
<script>
  // 개발 중: 옛 파일이 캐시에 남아 코드가 어긋나지 않게 매번 새로 받는다
  const VER = Date.now();
  // 파일을 직접 열면 브라우저가 그림 읽기를 막아 화면이 나오지 않는다
  if (location.protocol === 'file:') document.write('<div style="position:fixed;inset:0;z-index:99;background:#17151c;color:#ece4d4;display:flex;align-items:center;justify-content:center;font:18px sans-serif">http://localhost:8765/ 로 열어 주세요</div>');
  // 불러오기 목록: js/manifest.js (game → render). 목록 파일도 매번 새로 받는다 — 옛 목록이 캐시에 남으면 옮긴 파일을 옛 경로로 찾는다
  document.write(`<script src="js/manifest.js?v=${VER}"><\/script>`);
</script>
<!-- 파일 사이에서 최상위 이름을 공유한다: 순서가 곧 의존 순서. MANIFEST.fixed의 큰 정적 파일은 캐시를 쓴다 -->
<script>for (const p of [...MANIFEST.game, ...MANIFEST.explore.filter(p => !p.endsWith('/ui')), ...MANIFEST.render]) document.write(`<script src="${p}.js${MANIFEST.fixed.includes(p) ? '' : `?v=${VER}`}"><\/script>`);</script>
</body>
</html>
