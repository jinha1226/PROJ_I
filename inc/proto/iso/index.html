<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿼터뷰 시험</title>
<style>
  :root { --bg:#efe7d6; --ink:#2a2420; --dim:#857a6c; --line:#d8cdb8; --card:#f7f1e4; --ok:#3f7d4a; --no:#b5392b; --gold:#a8761c; }
  body.dark { --bg:#17151c; --ink:#ece4d4; --dim:#8d8577; --line:#35303d; --card:#211e28; --ok:#7fc98a; --no:#e8695a; --gold:#e3b34d; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); overflow:hidden; font:14px/1.45 "Noto Sans KR","Malgun Gothic",sans-serif; }
  #wrap { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; }
  #top { display:flex; align-items:center; justify-content:center; gap:10px; min-height:38px; padding:8px 16px 0; }
  #round { font-weight:700; }
  #order { display:flex; gap:3px; }
  #turninfo { font-size:13px; color:var(--dim); white-space:nowrap; } #turninfo b { color:var(--ink); font-size:14px; } #turninfo .mv { color:#6fa8ff; } #turninfo .rg { color:#f07a6e; }
  #brief .plan { margin-top:14px; display:flex; flex-wrap:wrap; gap:16px; text-align:left; justify-content:center; } #brief .board { flex:0 0 auto; text-align:center; } #brief .dir { display:block; color:#f07a6e; font-size:12px; margin-bottom:4px; } #brief .grid { display:grid; grid-template-columns:repeat(3,92px); grid-auto-rows:88px; gap:4px; } #brief .cell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font:inherit; color:var(--ink); background:none; border:1px dashed var(--line); border-top:1px dashed var(--line); padding:2px; cursor:pointer; min-width:0; touch-action:none; user-select:none; } #brief .cell[style] { border:1px solid var(--line); border-top:3px solid var(--c); background:var(--card); } #brief .cell.on { outline:2px solid var(--ink); } #brief .cell b { font-size:13px; } #brief .cell small { color:var(--dim); font-size:11px; } #brief .cell .lab { color:#f0c070; } #brief .orders { flex:1 1 300px; min-width:0; display:flex; flex-direction:column; gap:7px; } #brief .trait { color:var(--dim); font-size:12px; } .pc .slots { display:block; color:#9fc8ff; font-size:11px; min-height:13px; } #brief .stance { color:#f0c070; font-size:14px; } #brief .orders h4 { margin:0; font-size:15px; color:var(--ink); } #brief .orders h4 small { color:var(--dim); font-weight:normal; font-size:12px; margin-left:6px; } #brief .presets, #brief .field { display:flex; flex-wrap:wrap; align-items:center; gap:3px; } #brief .field i { font-style:normal; color:var(--dim); font-size:12px; width:32px; } #brief .chip { font:inherit; font-size:12px; color:var(--dim); background:none; border:1px solid var(--line); padding:2px 8px; cursor:pointer; } #brief .chip.on { color:var(--ink); border-color:var(--ink); } #brief .presets .chip { font-size:13px; padding:4px 10px; }
  #order i { display:block; padding:1px 5px; font:700 11px/16px inherit; font-style:normal; color:#17151c; white-space:nowrap; opacity:.6; }
  #order i.cur { opacity:1; outline:2px solid var(--ink); outline-offset:1px; }
  #stage { position:relative; display:grid; place-items:center; min-height:0; }
  canvas { display:block; image-rendering:pixelated; }
  #floats { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .fl { position:absolute; transform:translate(-50%,-100%); font-weight:800; font-size:15px; white-space:nowrap; text-shadow:0 1px 0 var(--bg),1px 0 0 var(--bg),-1px 0 0 var(--bg),0 -1px 0 var(--bg); }
  #dm { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); max-width:min(640px,86vw); text-align:center; font-size:16px; font-style:italic; padding:2px 10px; background:var(--bg); }
  #roll { position:absolute; left:50%; top:10px; transform:translateX(-50%); width:320px; padding:10px 16px 10px 12px; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; gap:14px; overflow:visible; }
  #die { width:88px; height:88px; flex:none; image-rendering:pixelated; }
  #roll .h { display:block; color:var(--dim); font-size:13px; }
  #roll b.w { display:block; font-size:24px; line-height:1.25; }
  #roll .need { color:var(--ink); }
  #roll .a { color:var(--dim); font-size:13px; }
  #roll .ok { color:var(--ok); } #roll .no { color:var(--no); } #roll .big { color:var(--gold); }
  #ask { position:absolute; right:20px; top:16px; background:var(--card); border:2px solid var(--ink); padding:12px; width:min(300px,88vw); }
  #ask h3 { margin:0 0 8px; font-size:15px; }
  #ask button { display:block; width:100%; margin-top:5px; padding:7px 10px; text-align:left; font:inherit; color:inherit; background:none; border:1px solid var(--line); cursor:pointer; }
  #ask button:hover,#ask button.def { border-color:var(--ink); }
  #ask small { color:var(--dim); margin-left:6px; }
  #ask .bar { height:3px; background:var(--ink); margin-top:8px; }
  #party { display:flex; justify-content:center; gap:6px; padding:6px 16px 12px; flex-wrap:wrap; }
  .pc { width:178px; padding:5px 8px; border-top:3px solid var(--c); background:var(--card); }
  .sk.k-explore { border-color:#3e5a55; cursor:pointer; } .sk.k-explore.off img { opacity:.45; } .sk.k-explore.sel { border-color:#7fe0cf; box-shadow:0 0 0 1px #7fe0cf; } .sks { display:flex; flex-wrap:wrap; gap:3px; margin-top:5px; } .sk { position:relative; display:block; width:26px; height:26px; background:#0d0e13; border:1px solid var(--line); cursor:help; font-style:normal; } .sk img { display:block; width:100%; height:100%; image-rendering:pixelated; } .sk u { position:absolute; right:-1px; bottom:-1px; min-width:11px; padding:0 2px; background:#000c; color:#ffe9a8; font-size:10px; line-height:12px; text-align:center; text-decoration:none; font-weight:700; } .sk.none img { filter:grayscale(1) brightness(.45); } .sk.none u { color:#c47a72; } .sk.k-act { border-color:#c9a86a; } .sk.k-bonus { border-color:#6fb4ff; } .sk.k-react { border-color:#c88cff; } .sk.k-free { border-color:#7fd08a; } .sk.k-pas { border-color:#6a6d75; border-style:dashed; } .sk.hit { animation:skhit .8s ease-out; z-index:2; } @keyframes skhit { 0% { transform:scale(1.5); box-shadow:0 0 14px 4px #ffe9a8; filter:brightness(2.2); } 35% { transform:scale(1.25); box-shadow:0 0 10px 3px #ffe9a8; filter:brightness(1.6); } 100% { transform:none; box-shadow:none; filter:none; } } .sk.lock { opacity:.35; } .sks.mini { justify-content:center; gap:2px; margin-top:3px; } .sks.mini .sk { width:18px; height:18px; } .sks.mini .sk u { display:none; } .sk:focus-visible { outline:1px solid var(--ink); }
  #floats { position:absolute; inset:0; pointer-events:none; overflow:hidden; } .bub { position:absolute; left:0; top:0; max-width:220px; width:max-content; padding:3px 8px; background:#14151ce8; border:1px solid var(--line); color:var(--ink); font-size:13px; line-height:1.35; text-align:center; } .bub::after { content:''; position:absolute; left:50%; bottom:-5px; width:8px; height:8px; margin-left:-4px; background:#14151c; border-right:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg); } .skname { position:absolute; left:0; top:0; display:flex; align-items:center; gap:6px; width:max-content; padding:3px 10px 3px 4px; background:#20180cf2; border:1px solid #ffe08a; color:#ffe08a; font-size:15px; font-weight:700; line-height:1.3; box-shadow:0 2px 8px #000a; z-index:3; } .skname img { width:22px; height:22px; image-rendering:pixelated; }
  #sktip { position:fixed; z-index:20; width:230px; padding:8px 10px; background:#14151c; border:1px solid var(--line); box-shadow:0 4px 14px #0008; pointer-events:none; text-align:left; } #sktip b { font-size:14px; } #sktip small { display:block; color:var(--dim); font-size:11px; } #sktip .kind { display:inline-block; margin-top:4px; padding:0 6px; font-size:12px; font-weight:700; border:1px solid; } #sktip .k-act { color:#e8cf9a; border-color:#c9a86a; } #sktip .k-bonus { color:#a8d2ff; border-color:#6fb4ff; } #sktip .k-react { color:#dcb8ff; border-color:#c88cff; } #sktip .k-free { color:#a8e8b2; border-color:#7fd08a; } #sktip .k-pas { color:#b4bac4; border-color:#6a6d75; } #sktip i { display:block; margin-top:3px; color:#9fc8ff; font-style:normal; font-size:11px; } #sktip p { margin:5px 0 0; font-size:12px; line-height:1.45; } #sktip em { display:block; margin-top:5px; color:#ffe9a8; font-style:normal; font-size:11px; } #sktip.hidden { display:none; }
  .pc.down { opacity:.5; } .pc.cur { outline:1px solid var(--ink); }
  .pc b { font-size:13px; } .pc span { color:var(--dim); font-size:12px; margin-left:4px; }
  .hp { height:4px; background:var(--line); margin-top:3px; } .hp i { display:block; height:100%; background:var(--ok); }
  .hp.st i { background:#a878d8; } .hp.st { height:4px; margin-top:2px; } .pc .stv { display:block; color:#b79ad6; font-size:11px; line-height:14px; } .pc.hot .stv, .sk-h.hot { color:#ff8a7a; } .pc.hot .hp.st i { background:#ff6a5a; } .sk-h { display:block; }
  .hidden { display:none !important; }
  #brief .mon { margin-top:6px; text-align:left; font-size:12px; line-height:1.5; } #brief .mon span { display:block; color:#e8e0cc; } #brief .tag { display:inline-block; margin:1px 3px 1px 0; padding:0 5px; border-radius:3px; font-style:normal; font-size:11px; } #brief .tag.must { background:#6a3a12; color:#ffd9a0; } #brief .tag.weak { background:#1f4d2a; color:#a8efb8; } #brief .tag.bad { background:#5a1f24; color:#ffb4b4; } #brief .tag.res { background:#33363d; color:#b4bac4; }
  #brief { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); width:min(760px,calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; text-align:center; z-index:5; } #brief h3 { color:var(--ink); font-size:16px; margin:0 0 12px; } #brief .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; } #brief .card { flex:1 1 180px; display:flex; flex-direction:column; gap:6px; padding:12px; font:inherit; color:var(--dim); background:none; border:1px solid var(--line); cursor:pointer; } #brief .card b { color:var(--ink); font-size:16px; } #brief .card small { color:#f0c070; } #brief .card span { font-size:12px; } #brief .card { text-align:left; } #brief .card.on { border-color:var(--ink); } #brief .go { margin-top:14px; padding:6px 28px; font:inherit; color:var(--ink); background:none; border:1px solid var(--ink); cursor:pointer; }
  #fps { position:fixed; right:8px; top:6px; color:var(--dim); font-size:11px; }
  @media (max-width:640px) { #roll { width:260px; } .pc { width:calc(50% - 4px); } .sk { width:30px; height:30px; } }
  @media (max-width:640px) { #brief .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } #brief .board { width:100%; } #brief { top:0; transform:translateX(-50%); padding:12px 0; } #brief .card { flex:1 1 100%; padding:8px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><span id="round"></span><span id="order"></span><span id="turninfo"></span></div>
  <div id="stage"><canvas id="c"></canvas><div id="floats"></div>
    <div id="roll" class="hidden"><canvas id="die" width="44" height="44"></canvas><div><small class="h"></small><b class="w"></b><div class="a"></div></div></div>
    <div id="dm" class="hidden"></div>
    <div id="ask" class="hidden"><h3></h3><div class="opts"></div><div class="bar"></div></div>
  </div>
  <div id="brief" class="hidden"></div>
  <div id="party"></div>
</div>
<div id="fps"></div>
<script>
  for (const n of ['core','data','srd_mons','grid','juice','tree','trees','season','fantasy','rivals','guild','persona','dnd','feats','trinkets','bonds','report','skills','srd','srd_spells','spells','traits','options','pools','combo','events','command','expedition','mission','explore','banter','sight','tactics','foe','region','res','turn','flow','story','state'])
    document.write(`<script src="../../js/${n}.js"><\/script>`);
</script>
<script src="../../js/artset.js"></script>
<script src="dcss/map.js"></script>
<script src="pixelfx/pixelfx.bundle.js"></script>
<!-- 파일 사이에서 최상위 이름을 공유한다: 순서가 곧 의존 순서 -->
<script src="src/core.js"></script>
<script src="src/models.js"></script>
<script src="src/bake.js"></script>
<script src="src/sprites.js"></script>
<script src="src/game.js"></script>
<script src="src/fxlayer.js"></script>
<script src="src/pfx.js"></script>
<script src="src/dice.js"></script>
<script src="src/actors.js"></script>
<script src="src/props.js"></script>
<script src="src/hud.js"></script>
<script src="src/main.js"></script>
</body>
</html>
