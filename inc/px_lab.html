<style>

<body>
<section id="vox">
<h1>던전 한 층 — 맵 생성기 그대로, 복셀로</h1>
<p>RUN.gen.make(시드)가 만든 방 · 복도 구조를 칸당 8복셀로 세운다(판석 줄눈 = 칸 경계). 바닥 앞에 선 벽은 낮게 잘라 안이 보이게. 장식 · 문 · 함정은 생성기 것 그대로. <b>바닥을 누르면 파티가 복도를 따라 걸어간다</b>(밝힌 칸으로만). 시야: 파티에서 6칸 안, 막힘 없이 보이는 칸만 보이고, 한 번 본 곳은 흑백으로 남는다. 빛은 지금 보이는 곳의 파티 둘레만(등불 + 그 안의 횃불, 흔들림). 끌어서 둘러보기(파티 따라가기가 꺼진다), 미니맵을 누르면 그리로. <span id="flInfo" class="warn"></span></p>

<script src="js/explore/core.js"></script><script src="js/explore/data.js"></script><script src="js/explore/combat.js"></script><script src="js/explore/gen.js"></script><script src="js/explore/rules.js"></script><script src="js/explore/layout.js"></script>
<script>
'use strict';
// ── 인물: LAYERLAB 인형을 32px로 줄이기 (외곽선 우선 · 눈 살리기 · 1px 외곽선) ──
let natH = 1;
const mulberry = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// 인형의 실제 높이(scale 1)를 한 번 잰다: 큰 캔버스에 그려 불투명 픽셀의 위아래를 찾는다
function measure() {
  const c = document.createElement('canvas'); c.width = 600; c.height = 600;
  const x = c.getContext('2d'), d = PaperDoll.create(PaperDoll.random(mulberry(7)));
  d.draw(x, 300, 450, { scale: 1 });
  const a = x.getImageData(0, 0, 600, 600).data; let top = 600, bot = 0;
  for (let y = 0; y < 600; y++) for (let i = 0; i < 600; i++) if (a[(y * 600 + i) * 4 + 3] > 40) { if (y < top) top = y; if (y > bot) bot = y; }
  return Math.max(1, bot - top);
}

// 떨림과 외곽선 (2026-11-17 측정·비교)
// · 떨림: 숨쉬기 동작은 32px 인물에서 0.5~1px밖에 안 움직이는데(2° 기울기, 6% 늘어남, 몸 0.4px 오르내림) 매 화면 반 픽셀씩
//   다른 자리에서 다시 줄이니 평균 색이 프레임마다 바뀌어 인물 속이 통째로 일렁였다(32px에서 초당 약 16000픽셀이 바뀜).
//   → 동작 끊기 + 미리 굽기(정해진 장만 한 번 그려 두고 되풀이) + 픽셀 맞춤(쉬는 자세 대비 움직임을 1px 계단으로) + 깜빡임 청소.
// · 외곽선: 부위 그림의 검은 선은 원본에서 약 5px — 32px 인물이면 1.3px라, 칸 경계에 걸리면 두 칸에 반씩 나뉘어 회색으로 흐려진다.
//   → '외곽선 우선' 줄이기: 칸 안에 어두운 표본이 DARK_COVER 이상이면 그 칸은 외곽선 색, 아니면 어둡지 않은 표본만 평균.
// · 눈: 32px에서 눈 하나가 3~5칸, 그 안 흰자·반짝임은 1칸 남짓이라 검은 테두리에 둘러싸여 '외곽선 우선'에 통째로 먹혔다(24px는 거의 다).
//   → '눈 살리기': 눈을 빼고 한 번 더 그려 달라진 표본 = 보이는 눈(머리카락·투구에 가린 곳은 빠진다). 그런 표본이 EYE_COVER 이상인 칸은
//   밝은 표본(흰자·반짝임)이 EYE_LIGHT 이상이면 그 색, 눈동자 색이 30% 이상이면 그 색, 아니면 원래대로. 20%로 하면 흰자가 동공까지 덮었다.
// · 첫 시도처럼 부위마다 그리는 자리를 따로 반올림하면 부위끼리 반 픽셀씩 어긋나 어설퍼진다 — 움직인 양만 계층째 끊는다.
const SS = 8, DARK_LUM = 70, DARK_COVER = 0.4, EYE_COVER = 0.25, EYE_LIGHT = 0.35, LIGHT_LUM = 150;
const hi = document.createElement('canvas'), hx = hi.getContext('2d', { willReadFrequently: true });

// 픽셀 맞춤: 쉬는 자세 대비 움직임(이동·회전·크기)을 키 H에서 약 1px씩의 계단으로 끊는다.
// 쉬는 자세의 부위 배치는 그대로 두므로 부위끼리 어긋나지 않는다. 이동 1px = natH/(100H) 단위 (scale 1에서 1단위 = 100px)
function quantize(d, H) {
  const ts = natH / (100 * H), rs = 180 / Math.PI / H, ss = 2 / H;
  for (const n of d.nodes) {
    const f = n.def;
    if (n.parent) { n.x = f.x + Math.round((n.x - f.x) / ts) * ts; n.y = f.y + Math.round((n.y - f.y) / ts) * ts; }
    n.rot = f.rot + Math.round((n.rot - f.rot) / rs) * rs;
    if (f.sx) n.sx = f.sx * (1 + Math.round((n.sx / f.sx - 1) / ss) * ss);
    if (f.sy) n.sy = f.sy * (1 + Math.round((n.sy / f.sy - 1) / ss) * ss);
  }
}

// 외곽선 우선 줄이기: hi(SS배)의 SS×SS 표본마다 — 덮인 표본이 43% 미만이면 빈 칸, 어두운 표본이 DARK_COVER 이상이면 그 평균(외곽선),
// 아니면 어둡지 않은 표본만 평균 (외곽선이 옆 칸 색을 탁하게 물들이지 않게).
// eye = { d: 눈을 빼고 그린 표본, x, y, w, h: 그 상자(칸 단위) } 가 있으면 상자 안 눈 칸은 밝은 점 우선
function sampleDark(src, w, h, eye) {
  const HW = hi.width, N = SS * SS;
  const img = new ImageData(w, h), p = img.data;
  for (let cy = 0; cy < h; cy++) for (let cx = 0; cx < w; cx++) {
    let cov = 0, dk = 0, dr = 0, dg = 0, db = 0, fa = 0, fr = 0, fg = 0, fb = 0;
    let ec = 0, la = 0, lr = 0, lg = 0, lb = 0, ma = 0, mr = 0, mg = 0, mb = 0;
    const noEye = eye && cx >= eye.x && cx < eye.x + eye.w && cy >= eye.y && cy < eye.y + eye.h ? eye.d : null, EW = eye ? eye.w * SS : 0;
    for (let yy = 0; yy < SS; yy++) {
      let j = ((cy * SS + yy) * HW + cx * SS) * 4, k = noEye ? (((cy - eye.y) * SS + yy) * EW + (cx - eye.x) * SS) * 4 : 0;
      for (let xx = 0; xx < SS; xx++, j += 4, k += 4) {
        if (src[j + 3] < 128) continue;
        cov++;
        const r = src[j], g = src[j + 1], b = src[j + 2], L = 0.3 * r + 0.59 * g + 0.11 * b;
        if (L < DARK_LUM) { dk++; dr += r; dg += g; db += b; } else { fa++; fr += r; fg += g; fb += b; }
        if (noEye && Math.abs(r - noEye[k]) + Math.abs(g - noEye[k + 1]) + Math.abs(b - noEye[k + 2]) + Math.abs(src[j + 3] - noEye[k + 3]) > 24) {
          ec++;
          if (L >= LIGHT_LUM) { la++; lr += r; lg += g; lb += b; } else if (L >= DARK_LUM) { ma++; mr += r; mg += g; mb += b; }
        }
      }
    }
    if (cov < N * 0.43) continue;
    const o = (cy * w + cx) * 4;
    p[o + 3] = 255;
    if (ec >= N * EYE_COVER) {
      if (la >= N * EYE_LIGHT) { p[o] = lr / la; p[o + 1] = lg / la; p[o + 2] = lb / la; continue; }
      if (ma >= N * 0.3) { p[o] = mr / ma; p[o + 1] = mg / ma; p[o + 2] = mb / ma; continue; }
    }
    if (dk >= N * DARK_COVER || !fa) { p[o] = dr / dk; p[o + 1] = dg / dk; p[o + 2] = db / dk; }
    else { p[o] = fr / fa; p[o + 1] = fg / fa; p[o + 2] = fb / fa; }
  }
  return img;
}

// 눈 부위 (평소 눈 + 쓰러짐·기절 눈)
const eyeNodes = d => d._eyes || (d._eyes = d.nodes.filter(n => n.def.path === 'Body/Head/Eye' || n.def.path === 'Body/Head/Ani_Eye'));
// 눈을 빼고 그리기는 눈 자리 상자 안만 (잘라 그리기) — 인물 전체를 한 번 더 그리면 한 장 굽는 시간이 거의 두 배가 된다.
// 상자는 눈 그림만 목표 크기로 작게 그려 찾고 1칸 넉넉히
const eyeCv = document.createElement('canvas'), ecx = eyeCv.getContext('2d', { willReadFrequently: true });
function eyeSample(d, w, h, drawAt) {
  const en = eyeNodes(d), keep = new Set(en), sp = d.nodes.map(n => n.sprite);
  d.nodes.forEach(n => { if (!keep.has(n)) n.sprite = null; });
  eyeCv.width = w; eyeCv.height = h; drawAt(ecx, 1 / SS);
  d.nodes.forEach((n, i) => n.sprite = sp[i]);
  const a = ecx.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (a[(y * w + x) * 4 + 3]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1); x1 = Math.min(w - 1, x1 + 1); y1 = Math.min(h - 1, y1 + 1);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, sv = en.map(n => n.show); en.forEach(n => n.show = false);
  hx.save(); hx.beginPath(); hx.rect(x0 * SS, y0 * SS, bw * SS, bh * SS); hx.clip(); // 상자 밖은 그리지도 않게
  hx.clearRect(x0 * SS, y0 * SS, bw * SS, bh * SS); drawAt(hx, 1); hx.restore();
  en.forEach((n, i) => n.show = sv[i]);
  return { d: hx.getImageData(x0 * SS, y0 * SS, bw * SS, bh * SS).data, x: x0, y: y0, w: bw, h: bh };
}

// 한 장: 고해상도로 그린 뒤 목표 크기로 줄이고, 알파를 0/1로, 색을 단계로, 바깥 1px 외곽선 → 작은 ImageData
function render(d, H, opt) {
  const W = Math.round(H * 1.4), w = W, h = H + 6; // 무기가 옆으로 삐져나오므로 폭을 넉넉히
  hi.width = W * SS; hi.height = h * SS;
  // 발 위치도 픽셀 칸에 맞춘다 (W가 홀수면 가운데가 반 칸에 걸린다)
  // k = 1: hi(SS배), k = 1/SS: 목표 크기
  const drawAt = (ctx, k) => d.draw(ctx, (opt.snap ? Math.floor(W / 2) * SS : hi.width / 2) * k, (H + 3) * SS * k, { scale: H * SS * k / natH });
  hx.clearRect(0, 0, hi.width, hi.height); drawAt(hx, 1);
  let img;
  if (opt.samp === 'dark') {
    const src = hx.getImageData(0, 0, hi.width, hi.height).data;
    img = sampleDark(src, w, h, opt.eye ? eyeSample(d, w, h, drawAt) : null);
  }
  else {
    const sm = document.createElement('canvas'); sm.width = w; sm.height = h;
    const sx = sm.getContext('2d');
    if (opt.samp === 'smooth') {
      // 반씩 줄여 가며 평균 (한 번에 줄이면 브라우저가 점을 건너뛴다)
      let src = hi, ww = hi.width, hh = hi.height;
      while (ww / 2 >= W) { const t = document.createElement('canvas'); t.width = ww / 2; t.height = hh / 2; const tx = t.getContext('2d'); tx.imageSmoothingQuality = 'high'; tx.drawImage(src, 0, 0, t.width, t.height); src = t; ww = t.width; hh = t.height; }
      sx.imageSmoothingEnabled = true; sx.drawImage(src, 0, 0, w, h);
    } else { sx.imageSmoothingEnabled = false; sx.drawImage(hi, 0, 0, w, h); }
    img = sx.getImageData(0, 0, w, h);
  }
  const p = img.data, solid = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const a = p[i * 4 + 3];
    if (a < 110) { p[i * 4 + 3] = 0; continue; }
    solid[i] = 1;
    // getImageData는 이미 곱해지지 않은 색을 돌려준다 — 알파로 다시 나누면 가장자리가 튀는 얼룩이 된다
    if (opt.post) for (let k = 0; k < 3; k++) { const s = 255 / (opt.post - 1); p[i * 4 + k] = Math.round(p[i * 4 + k] / s) * s; }
    p[i * 4 + 3] = 255;
  }
  if (opt.outl) {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (solid[i]) continue;
      const nb = (x > 0 && solid[i - 1]) || (x < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w]);
      if (nb) { p[i * 4] = 20; p[i * 4 + 1] = 16; p[i * 4 + 2] = 22; p[i * 4 + 3] = 255; }
    }
  }
  return img;
}


PaperDoll.load('assets/chars/').then(() => { natH = measure(); }).catch(e => console.warn('인형:', e.message));
</script>

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16 - .5);

const P = {

    for (const [cxx, cy] of list) { const k = cxx + ',' + cy, ck = W.chunks.get(k); if (!ck) { pending++; if (!queue.includes(k)) queue.push(k); continue; } if (ck.empty) continue; x.drawImage(ck.cv, ck.sx0 - ox, ck.sy0 - oy); }
    const [lc, lx, ly] = drawLit(ox, oy, list, t); x.drawImage(lc, lx, ly);
    for (const f of W.party.slice().sort((a, b) => a.x + a.y - b.x - b.y)) {
      const dc = dollCanvas(f.doll); if (!dc) continue; const im = tex[f.doll], [sx, sy] = proj(f.x, f.y, FLOOR), X0 = Math.round(sx - ox), Y0 = Math.round(sy - oy) - (im.foot ?? im.h - 1) + 1;
      if (f.flip) { x.save(); x.translate(X0, 0); x.scale(-1, 1); x.drawImage(dc, -Math.round(im.w / 2), Y0); x.restore(); } else x.drawImage(dc, X0 - Math.round(im.w / 2), Y0);
    }
    lastOx = ox; lastOy = oy;
    const info = document.getElementById('flInfo'), ex = W.explored.reduce((a, b) => a + b, 0), tot = W.kind.reduce((a, b) => a + (b > 0), 0);
    if (info) info.textContent = pending ? `굽는 중… 보이는 조각 ${pending}개 남음` : `${W.L.frame} · ${W.CW}×${W.CH}칸 · 방 ${Object.keys(W.L.room).length} · 밝힌 바닥 ${W.explored.reduce((a, b, i) => a + (b && W.kind[i] > 0), 0)}/${tot}칸`;
    drawMini(ox, oy, cw, ch);
    if (queue.length && !busy) { busy = true; setTimeout(() => { const k = queue.shift(); if (k && !W.chunks.has(k)) { const [a, b] = k.split(',').map(Number); W.chunks.set(k, bakeChunk(a, b)); } busy = false; }, 0); }
  }
  function drawMini(ox, oy, cw, ch) {
    const mc = $m(); if (!mc) return; const k = 3, w = W.CW * k, h = W.CH * k; if (mc.width !== w) { mc.width = w; mc.height = h; mc.style.width = w * 1.4 + 'px'; }
    const x = mc.getContext('2d'); x.clearRect(0, 0, w, h);
    for (let cy = 0; cy < W.CH; cy++) for (let cx = 0; cx < W.CW; cx++) { const i = cy * W.CW + cx, kk = W.kind[i]; if (!kk || !(W.explored[i] || W.reveal)) continue; x.fillStyle = W.visible[i] ? (kk === 1 ? '#e0c088' : '#9a8a70') : kk === 1 ? '#8a7450' : '#5a5040'; x.fillRect(cx * k, cy * k, k, k); }
    const L0 = W.party[0]; x.fillStyle = '#5ae070'; x.fillRect(L0.x / VPC * k - 2, L0.y / VPC * k - 2, 4, 4);
    const pts = [[ox, oy], [ox + cw, oy], [ox + cw, oy + ch], [ox, oy + ch]].map(([sx, sy]) => unproj(sx, sy + FLOOR * COS * S)).map(([a, b]) => [a / VPC * k, b / VPC * k]);
    x.strokeStyle = '#f0e0b0'; x.lineWidth = 1; x.beginPath(); pts.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b))); x.closePath(); x.stroke();
  }
  function start(seed, texIn, figs) {
    tex = texIn; queue = []; build(seed, figs);
    W.explored = new Uint8Array(W.CW * W.CH); W.visible = new Uint8Array(W.CW * W.CH); W.reveal = !!document.getElementById('flAll')?.checked; W.walk = null;
    const L0 = W.party[0]; W.party.forEach(f => { f.x = L0.x; f.y = L0.y; }); W.trail = W.party.map(() => [L0.x, L0.y]); W.cell = [Math.floor(L0.x / VPC), Math.floor(L0.y / VPC)];
    look(W.cell[0], W.cell[1]); lookAtCell(W.cell[0], W.cell[1]); draw();
  }
  function wire() {
    const wrap = document.getElementById('flWrap'); let drag = null;
    wrap.addEventListener('pointerdown', e => { if (e.target.id === 'flMini') return; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: 0 }; wrap.setPointerCapture(e.pointerId); wrap.style.cursor = 'grabbing'; });
    wrap.addEventListener('pointermove', e => { if (!drag) return; drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y)); if (drag.moved > 5) follow = false; cam.x = drag.cx - (e.clientX - drag.x) / zoom; cam.y = drag.cy - (e.clientY - drag.y) / zoom; });
    wrap.addEventListener('pointerup', e => {
      const d = drag; drag = null; wrap.style.cursor = 'grab'; if (!d || d.moved > 5 || !W) return;
      const r = $c().getBoundingClientRect(), [wx, wy] = unproj(lastOx + (e.clientX - r.left) / zoom, lastOy + (e.clientY - r.top) / zoom + FLOOR * COS * S);
      if (walkTo(Math.floor(wx / VPC), Math.floor(wy / VPC))) follow = true;
    });
    document.getElementById('flMini').addEventListener('click', e => { const r = e.target.getBoundingClientRect(), cx = (e.clientX - r.left) / r.width * W.CW, cy = (e.clientY - r.top) / r.height * W.CH; follow = false; lookAtCell(cx - .5, cy - .5); });
    document.querySelectorAll('#flBar [data-z]').forEach(b => b.addEventListener('click', () => { zoom = +b.dataset.z; document.querySelectorAll('#flBar [data-z]').forEach(x => x.classList.toggle('on', x === b)); }));
    document.getElementById('flStart').onclick = () => { follow = true; };
    document.getElementById('flAll').onchange = e => { W.reveal = e.target.checked; for (const ck of W.chunks.values()) if (!ck.empty) paint(ck); };
    let last = 0; const tick = t => {
      const dt = Math.min(.1, (t - last) / 1000); last = t;
      if (W) { stepWalk(dt); if (follow) { const L0 = W.party[0], [sx, sy] = proj(L0.x, L0.y, FLOOR); cam.x += (sx - cam.x) * .12; cam.y += (sy - cam.y) * .12; } draw(t / 1000); }

})();

// 파티 인형 넷: 위 스크립트의 인형(PaperDoll · natH · render)으로 32px. 준비가 안 되면 DCSS 사람 그림
async function partyDolls(tex) {
  if (typeof render !== 'function' || !window.PaperDoll) return false;
  for (let k = 0; k < 200 && !(natH > 1); k++) await new Promise(r => setTimeout(r, 50));
  if (!(natH > 1)) return false;
  for (let i = 0; i < 4; i++) { const d = PaperDoll.create(PaperDoll.random(mulberry(777 + i * 131))); if (PaperDoll.anims.Idle) d.play('Idle'); d.update(.01); const img = render(d, 32, { samp: 'dark', eye: true, post: 0, outl: true, snap: true }); tex['fl' + i] = { w: img.width, h: img.height, d: new Uint8ClampedArray(img.data), foot: 35, sc: 1 }; }
  return true;
}
(async () => {
  const tex = { m_human: await loadImg('m_human') }, figs = (await partyDolls(tex)) ? ['fl0', 'fl1', 'fl2', 'fl3'] : ['m_human', 'm_human', 'm_human', 'm_human'];
  const seed = () => +document.getElementById('flSeed').value || 1;
  FL.wire(); FL.start(seed(), tex, figs);
  document.getElementById('flGo').onclick = () => FL.start(seed(), tex, figs);
})();
})();
