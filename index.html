<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PROJ_I · Arena</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e17;color:#f1eee5;font:14px system-ui,sans-serif;overflow:hidden}#game{position:relative;width:100vw;height:100dvh;overflow:hidden}#game canvas{display:block}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:12px;pointer-events:none}#title{font-size:15px;font-weight:900;letter-spacing:.12em;color:#f0d59d;text-shadow:0 2px 6px #000}#status{font-size:12px;color:#e2e7ef;background:#111a29c9;padding:8px 11px;border:1px solid #465267;border-radius:9px}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;display:flex;flex-direction:column;gap:8px}.party{display:flex;gap:6px}.card{flex:1;min-width:0;background:#121b2bdc;border:1px solid #4a576b;border-radius:9px;padding:8px}.name{font-size:12px;font-weight:750;display:flex;justify-content:space-between;gap:3px}.hp{height:5px;border-radius:6px;background:#3c2630;margin-top:6px;overflow:hidden}.hp span{display:block;height:100%;background:#67c78a;width:100%;transition:width .2s}.buttons{display:flex;justify-content:center;gap:8px}button{background:#c99a57;color:#16171a;border:0;border-radius:9px;padding:11px 22px;font-weight:800;cursor:pointer}button.secondary{background:#29374a;color:#e2e7ef}#notice{position:absolute;left:50%;top:19%;transform:translateX(-50%);font-size:22px;font-weight:900;text-shadow:0 2px 8px #000;text-align:center;pointer-events:none;white-space:nowrap}#error{display:none;position:absolute;inset:20% 12px auto;padding:16px;background:#411b20f0;border:1px solid #e17575;border-radius:10px;white-space:pre-wrap;z-index:10}.float{position:absolute;z-index:3;font-size:21px;font-weight:900;pointer-events:none;text-shadow:0 2px 5px #000;animation:pop .75s forwards}@keyframes pop{to{transform:translateY(-44px);opacity:0}}@media(min-width:800px){#bottom{max-width:560px;left:50%;right:auto;width:90%;transform:translateX(-50%)}#title{font-size:20px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="game"><div id="hud"><div id="title">PROJ_I <span style="font-weight:400;color:#9fb1c4">/ COMBAT TEST</span></div><div id="status">KayKit 로딩 중...</div></div><div id="notice"></div><div id="error"></div><div id="bottom"><div class="party" id="party"></div><div class="buttons"><button id="restart" disabled>다시 전투</button><button id="pause" class="secondary">일시정지</button></div></div></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {clone} from 'three/addons/utils/SkeletonUtils.js';
const $=id=>document.getElementById(id),game=$('game');const scene=new THREE.Scene();scene.background=new THREE.Color(0x111722);scene.fog=new THREE.Fog(0x111722,23,48);
const camera=new THREE.OrthographicCamera(-12,12,12,-12,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;game.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc4d6ff,0x33291d,2));const sun=new THREE.DirectionalLight(0xffe2ae,3);sun.position.set(-7,16,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});const stone=mat(0x4d5960),dark=mat(0x303c43),trim=mat(0x738087),wood=mat(0x77523a),flameMat=new THREE.MeshBasicMaterial({color:0xffaa55});const loader=new GLTFLoader(),assets=new Map();let actors=[],particles=[],paused=false,ready=false,finished=false,last=performance.now(),round=0;
function block(w,h,d,x,y,z,m=stone){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.receiveShadow=true;o.castShadow=true;scene.add(o);return o}
function room(){block(18,.35,14,0,-.24,0);for(let x=-8;x<=8;x+=2)for(let z=-6;z<=6;z+=2){const b=block(1.92,.045,1.92,x,-.035,z,(x+z)%4===0?dark:stone);b.receiveShadow=true}for(let x=-9;x<=9;x+=2){block(2,2.6,.7,x,1.3,-7.4,dark);block(2,.5,.85,x,2.7,-7.4,trim)}for(let z=-7;z<=7;z+=2){block(.7,2.6,2,-9.3,1.3,z,dark);block(.85,.5,2,-9.3,2.7,z,trim);block(.7,2.6,2,9.3,1.3,z,dark);block(.85,.5,2,9.3,2.7,z,trim)}for(const x of [-7.7,7.7])for(const z of [-5.8,5.8]){block(.95,2.8,.95,x,1.4,z,trim);block(1.25,.35,1.25,x,2.85,z,stone)}for(const x of [-7.4,7.4]){block(.28,1.5,.28,x,.75,-5.6,wood);const fire=new THREE.Mesh(new THREE.IcosahedronGeometry(.28,0),flameMat);fire.position.set(x,1.65,-5.6);scene.add(fire);const light=new THREE.PointLight(0xff9c48,6,10);light.position.copy(fire.position);scene.add(light)}}
room();const markerGeo=new THREE.CircleGeometry(.66,32);function marker(color){const m=new THREE.Mesh(markerGeo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.35,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=.035;scene.add(m);return m}
async function load(name){if(!assets.has(name))assets.set(name,loader.loadAsync('assets/kaykit/'+name+'.glb'));return assets.get(name)}
function animation(a,type,force=false){if(!a.actions)return;const patterns={idle:/idle/i,walk:/walk|run/i,attack:/attack|slash|shoot|cast/i,hit:/hit|hurt|damage/i,death:/death|die/i};const key=Object.keys(a.actions).find(k=>patterns[type].test(k));if(!key||(!force&&a.anim===key))return;const act=a.actions[key];if(a.current&&a.current!==act)a.current.fadeOut(.12);act.reset().fadeIn(.12);act.setLoop(type==='attack'||type==='hit'||type==='death'?THREE.LoopOnce:THREE.LoopRepeat,type==='attack'||type==='hit'||type==='death'?1:Infinity);act.clampWhenFinished=type==='death';act.play();a.current=act;a.anim=key;if(type==='attack'||type==='hit'){clearTimeout(a.animTimeout);a.animTimeout=setTimeout(()=>{if(a.hp>0)animation(a,'idle')},Math.min(900,Math.max(280,act.getClip().duration*850)))}}
async function spawn(name,team,x,z,hp,damage,range,cooldown){const gltf=await load(name);const root=clone(gltf.scene);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3());const scale=1.7/Math.max(size.y,.01);root.scale.setScalar(scale);root.position.set(x,-box.min.y*scale,z);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(root);const a={name,team,root,pos:new THREE.Vector3(x,0,z),hp,max:hp,damage,range,cooldown,timer:Math.random()*.35,mixer:new THREE.AnimationMixer(root),actions:{},current:null,anim:null,ring:marker(team==='hero'?0x7ec7ed:0xe76d68),dead:false};for(const clip of gltf.animations)a.actions[clip.name]=a.mixer.clipAction(clip);actors.push(a);animation(a,'idle');return a}
function look(a,b){const d=b.pos.clone().sub(a.pos);d.y=0;if(d.lengthSq()>.001){const angle=Math.atan2(d.x,d.z);a.root.rotation.y=angle}}
function move(a,goal,dt){const delta=goal.clone().sub(a.pos);delta.y=0;const distance=delta.length();if(distance<.05)return;const step=Math.min(distance,dt*(a.team==='hero'?2.3:1.8));a.pos.addScaledVector(delta.normalize(),step);a.root.position.x=a.pos.x;a.root.position.z=a.pos.z;animation(a,'walk')}
const impacts=[],shots=[];let shake=0,flash=0;const fxMat=(color,opacity=1)=>new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false,side:THREE.DoubleSide});
function impact(pos,color,power=1){const ring=new THREE.Mesh(new THREE.RingGeometry(.12,.22,24),fxMat(color,.9));ring.rotation.x=-Math.PI/2;ring.position.copy(pos);ring.position.y=.13;scene.add(ring);impacts.push({mesh:ring,age:0,duration:.36,power});for(let i=0;i<9;i++){const angle=i*Math.PI*2/9;const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.055+Math.random()*.06,0),fxMat(color));m.position.copy(pos).add(new THREE.Vector3(0,1.1,0));scene.add(m);impacts.push({mesh:m,age:0,duration:.3+Math.random()*.2,velocity:new THREE.Vector3(Math.cos(angle)*(2+Math.random()*3),1+Math.random()*3,Math.sin(angle)*(2+Math.random()*3))})}shake=Math.max(shake,.16*power);flash=Math.max(flash,.07)}
function projectile(a,b,kind){const start=a.pos.clone().add(new THREE.Vector3(0,1.35,0)),end=b.pos.clone().add(new THREE.Vector3(0,1.15,0));const color=kind==='arrow'?0xffd68a:0x70b9ff;const core=new THREE.Mesh(kind==='arrow'?new THREE.ConeGeometry(.095,.8,7):new THREE.IcosahedronGeometry(.32,1),fxMat(color));core.position.copy(start);if(kind==='arrow')core.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),end.clone().sub(start).normalize());scene.add(core);let glow=null;if(kind==='spell'){glow=new THREE.PointLight(0x559bff,5,4);scene.add(glow)}shots.push({core,glow,start,end,age:0,duration:kind==='arrow'?.2:.37,kind,target:b,attacker:a})}
function float(a,value,color){const ndc=a.pos.clone().add(new THREE.Vector3(0,2.1,0)).project(camera);const el=document.createElement('div');el.className='float';el.textContent=value;el.style.color=color;el.style.left=((ndc.x+1)*.5*game.clientWidth)+'px';el.style.top=((1-ndc.y)*.5*game.clientHeight)+'px';game.append(el);setTimeout(()=>el.remove(),750)}
function applyDamage(a,b,color){if(b.dead)return;b.hp=Math.max(0,b.hp-a.damage);float(b,'-'+a.damage,color);impact(b.pos,a.team==='hero'?0xffd47d:0xff6666,a.name==='Knight'?1.7:1);b.stagger=.14;b.root.position.y+=.12;if(b.hp===0){b.dead=true;animation(b,'death',true);b.ring.visible=false;setTimeout(()=>{b.root.visible=false},800)}else animation(b,'hit',true)}
function hit(a,b){if(b.dead)return;animation(a,'attack',true);if(a.name==='Rogue_Hooded'){projectile(a,b,'arrow')}else if(a.name==='Mage'||a.name==='Skeleton_Mage'){projectile(a,b,'spell')}else{applyDamage(a,b,a.team==='hero'?'#ffe29b':'#ff8181')}}
function updateEffects(dt){for(let i=shots.length-1;i>=0;i--){const p=shots[i];p.age+=dt;const t=Math.min(1,p.age/p.duration);p.core.position.lerpVectors(p.start,p.end,t);if(p.kind==='spell'){p.core.scale.setScalar(1+Math.sin(t*Math.PI)*.6);p.core.rotation.y+=dt*8}if(p.glow)p.glow.position.copy(p.core.position);if(t>=1){scene.remove(p.core);if(p.glow)scene.remove(p.glow);shots.splice(i,1);if(!p.target.dead)applyDamage(p.attacker,p.target,p.kind==='spell'?'#8bc7ff':'#ffe29b')}}for(let i=impacts.length-1;i>=0;i--){const p=impacts[i];p.age+=dt;const t=Math.min(1,p.age/p.duration);if(p.velocity)p.mesh.position.addScaledVector(p.velocity,dt);else p.mesh.scale.setScalar(1+t*6);p.mesh.material.opacity=1-t;if(t>=1){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();impacts.splice(i,1)}}shake=Math.max(0,shake-dt*.65);flash=Math.max(0,flash-dt)}
function update(dt){if(!ready||paused||finished)return;for(const a of actors){a.mixer.update(dt);a.ring.position.x=a.pos.x;a.ring.position.z=a.pos.z;if(a.dead)continue;if(a.stagger>0){a.stagger-=dt;continue}const enemies=actors.filter(b=>b.team!==a.team&&!b.dead);if(!enemies.length)continue;const target=enemies.reduce((best,b)=>!best||b.pos.distanceToSquared(a.pos)<best.pos.distanceToSquared(a.pos)?b:best,null);look(a,target);const dist=a.pos.distanceTo(target.pos);if(dist>a.range){const desired=target.pos.clone().addScaledVector(a.pos.clone().sub(target.pos).normalize(),a.range*.78);move(a,desired,dt)}else{a.timer-=dt;if(a.timer<=0){hit(a,target);a.timer=a.cooldown}else if(a.anim==='walk')animation(a,'idle')}}updateEffects(dt);const heroes=actors.filter(a=>a.team==='hero'&&!a.dead),foes=actors.filter(a=>a.team==='enemy'&&!a.dead);if(!heroes.length||!foes.length){finished=true;$('notice').textContent=heroes.length?'VICTORY':'DEFEAT';$('status').textContent=heroes.length?'전투 승리':'파티 전멸';$('restart').disabled=false}renderHP()}
function renderHP(){for(const a of actors.filter(a=>a.team==='hero')){const bar=$('hp-'+a.name);if(bar)bar.style.width=(a.hp/a.max*100)+'%'}}
function resize(){const w=game.clientWidth,h=game.clientHeight;renderer.setSize(w,h);const aspect=w/h;const halfH=aspect<.8?13:10;camera.left=-halfH*aspect;camera.right=halfH*aspect;camera.top=halfH;camera.bottom=-halfH;camera.position.set(13,19,21);camera.lookAt(0,0,0);camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
async function start(){ready=false;finished=false;paused=false;$('pause').textContent='일시정지';$('restart').disabled=true;$('notice').textContent='';for(const a of actors){scene.remove(a.root);scene.remove(a.ring);clearTimeout(a.animTimeout)}for(const p of shots){scene.remove(p.core);if(p.glow)scene.remove(p.glow)}shots.length=0;for(const p of impacts)scene.remove(p.mesh);impacts.length=0;actors=[];try{await Promise.all([spawn('Knight','hero',-3,2.1,115,19,1.5,.9),spawn('Rogue_Hooded','hero',-1.4,3.2,78,13,5,1.15),spawn('Mage','hero',.5,3.4,75,11,5.5,1.3),spawn('Skeleton_Warrior','enemy',-1,-3,65,10,1.45,1.3),spawn('Skeleton_Warrior','enemy',1.4,-3.4,65,10,1.45,1.3),spawn('Skeleton_Mage','enemy',3,-2.2,55,12,4.8,1.7)]);$('party').innerHTML=actors.filter(a=>a.team==='hero').map(a=>'<div class="card"><div class="name"><span>'+({Knight:'전사',Rogue_Hooded:'궁수',Mage:'마법사'}[a.name])+'</span><span>'+a.max+' HP</span></div><div class="hp"><span id="hp-'+a.name+'"></span></div></div>').join('');$('status').textContent='3 vs 3 · 자동 전투';ready=true}catch(e){console.error(e);$('error').style.display='block';$('error').textContent='KayKit 모델 로드 실패: '+e.message+'\nGitHub Actions의 에셋 설치 결과를 확인하세요.';$('status').textContent='에셋 오류'}}
$('restart').onclick=start;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'계속':'일시정지'};
function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.05);last=t;update(dt);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.time+=dt;p.mesh.position.lerpVectors(p.from,p.to,Math.min(1,p.time/p.duration));if(p.time>=p.duration){scene.remove(p.mesh);particles.splice(i,1)}}if(shake>0){camera.position.x=13+(Math.random()-.5)*shake;camera.position.y=19+(Math.random()-.5)*shake;camera.position.z=21+(Math.random()-.5)*shake}else camera.position.set(13,19,21);renderer.render(scene,camera)}requestAnimationFrame(frame);start();
</script></body></html>
