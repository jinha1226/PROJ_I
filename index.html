TACTICS.barrier={role:'Mage',label:'보호막',cooldown:10,score:(a,allies)=>allies.some(h=>h.hp/h.max<.75)?75:0,execute:(a,allies)=>{const h=allies.slice().sort((x,y)=>x.hp/x.max-y.hp/y.max)[0];h.guard=a;h.guardTime=tacticLevel('barrier')>=2?6:4;h.guardFactor=tacticLevel('barrier')>=3?.35:.55;float(h,'보호막!','#8ecfff');impact(h.pos,0x8ecfff,.6)}};
const roles=['Knight','Rogue_Hooded','Mage'],roleLabels={Knight:'전사',Rogue_Hooded:'궁수',Mage:'마법사'};
const defaults={Knight:['taunt','protect'],Rogue_Hooded:['execute','kite'],Mage:['heal','aoe']};
const STORAGE='proj_i_tactics_v1';let progress={wins:0,gold:0,stage:1,highestStage:1,farming:false,tacticLevels:{},upgrades:{attack:0,health:0,healing:0},loadout:structuredClone(defaults)};
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&Number.isInteger(saved.wins)&&saved.wins>=0){progress.wins=saved.wins;progress.gold=Math.max(0,Math.floor(Number(saved.gold)||0));progress.stage=Math.max(1,Math.floor(Number(saved.stage)||1));progress.highestStage=Math.max(progress.stage,Math.floor(Number(saved.highestStage)||progress.stage));progress.farming=Boolean(saved.farming);for(const id of Object.keys(TACTICS))progress.tacticLevels[id]=Math.max(1,Math.min(3,Math.floor(Number(saved.tacticLevels?.[id])||1)));for(const key of ['attack','health','healing'])progress.upgrades[key]=Math.max(0,Math.min(100,Math.floor(Number(saved.upgrades?.[key])||0)));for(const role of roles){const choices=Object.keys(TACTICS).filter(k=>TACTICS[k].role===role);const selected=Array.isArray(saved.loadout?.[role])?saved.loadout[role].filter(k=>choices.includes(k)):[];if(selected.length)progress.loadout[role]=[...new Set(selected)].slice(0,3)}}}catch(e){console.warn('Tactics save reset',e)}
for(const id of Object.keys(TACTICS))progress.tacticLevels[id]??=1;const equipped=progress.loadout;function saveTactics(){localStorage.setItem(STORAGE,JSON.stringify(progress))}
const UPGRADES={attack:{label:'공격력',detail:'레벨당 +12%',base:20},health:{label:'최대 HP',detail:'레벨당 +15%',base:20},healing:{label:'치유 강화',detail:'레벨당 +20%',base:25}};
function upgradeCost(key){return Math.ceil(UPGRADES[key].base*Math.pow(1.55,progress.upgrades[key]))}
function renderUpgrades(){$('upgradeInfo').textContent='골드 '+progress.gold+' G · 스테이지 '+progress.stage;$('upgradeRows').innerHTML=Object.entries(UPGRADES).map(([key,u])=>'<div class="upgradeRow"><div><strong>'+u.label+' Lv.'+progress.upgrades[key]+'</strong><br><small>'+u.detail+'</small></div><button data-upgrade="'+key+'" '+(progress.gold<upgradeCost(key)?'disabled':'')+'>'+upgradeCost(key)+' G</button></div>').join('')}
$('upgradeRows').onclick=e=>{const b=e.target.closest('button[data-upgrade]');if(!b)return;const key=b.dataset.upgrade,cost=upgradeCost(key);if(progress.gold<cost)return;progress.gold-=cost;progress.upgrades[key]++;saveTactics();renderUpgrades();renderProgress()};
$('upgradeBtn').onclick=()=>{paused=true;$('pause').textContent='계속';$('tacticsPanel').hidden=true;renderUpgrades();$('upgradePanel').hidden=false};
$('closeUpgrades').onclick=()=>{$('upgradePanel').hidden=true;paused=false;$('pause').textContent='일시정지'};
function renderProgress(){$('status').textContent='STAGE '+progress.stage+(progress.farming?' · 파밍':'')+' · '+progress.gold+' G · '+currentTheme}
let nextBattleTimer=null;
function queueNextBattle(){clearTimeout(nextBattleTimer);nextBattleTimer=setTimeout(()=>{if(!paused&&!document.hidden)start();else queueNextBattle()},2300/speed)}
function tacticLevel(id){return progress.tacticLevels[id]||1}
function tacticCost(id){return tacticLevel(id)===1?75:tacticLevel(id)===2?200:Infinity}
const TACTIC_DETAILS={
 taunt:['반경 5 도발','반경 6.5 도발','도발 중 받는 피해 20% 감소'],
 protect:['피해 45% 감소','보호 시간 6초','보호 중 반격'],
 execute:['빈사 적 집중','집중 대상 추가 피해','처치 시 즉시 재선정'],
 kite:['적 접근 시 후퇴','후퇴 거리 증가','후퇴 후 공격력 증가'],
 heal:['응급 치료','회복량 35% 증가','회복 후 보호막'],
 aoe:['반경 2.8 공격','반경 3.5 공격','광역 피해 35% 증가'],
 ironwall:['자신 피해 45% 감소','지속시간 증가','자신 피해 65% 감소'],
 snipe:['적 마법사 집중','집중 시간 증가','저격 대상 추가 피해'],
 barrier:['피해 45% 감소','보호 지속시간 증가','피해 65% 감소']
};
function tacticsUnlocked(){return progress.wins>=1}
function renderTactics(){const slots=tacticsUnlocked()?3:2;$('tacticInfo').textContent='골드 '+progress.gold+' G · 승리 '+progress.wins+'회 · 장착 '+slots+'칸';$('tacticRows').innerHTML=roles.map(role=>'<section class="trow"><h3>'+roleLabels[role]+' ('+equipped[role].length+'/'+slots+')</h3>'+Object.entries(TACTICS).filter(([id,t])=>t.role===role).map(([id,t])=>{const active=equipped[role].includes(id),level=tacticLevel(id),cost=tacticCost(id);return '<div class="upgradeRow"><div><strong>'+t.label+' Lv.'+level+'/3</strong><br><small>'+TACTIC_DETAILS[id][level-1]+'</small><br><small>'+(level<3?'다음: '+TACTIC_DETAILS[id][level]:'최대 레벨')+'</small></div><div class="tchoices"><button data-role="'+role+'" data-tactic="'+id+'" class="'+(active?'active':'')+'" '+(!active&&equipped[role].length>=slots?'disabled':'')+'>'+(active?'장착 ✓':'장착')+'</button><button data-level="'+id+'" '+(level>=3||progress.gold<cost?'disabled':'')+'>'+(level>=3?'MAX':cost+' G')+'</button></div></div>'}).join('')+'</section>').join('')}
$('tacticRows').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.level){const id=b.dataset.level,cost=tacticCost(id);if(tacticLevel(id)>=3||progress.gold<cost)return;progress.gold-=cost;progress.tacticLevels[id]++;saveTactics();renderTactics();renderProgress();return}if(!b.dataset.tactic)return;const {role,tactic}=b.dataset,arr=equipped[role];if(arr.includes(tactic)){if(arr.length<=1)return;arr.splice(arr.indexOf(tactic),1)}else if(arr.length< (tacticsUnlocked()?3:2))arr.push(tactic);saveTactics();renderTactics()};
$('tacticsBtn').onclick=()=>{paused=true;$('upgradePanel').hidden=true;$('pause').textContent='계속';renderTactics();$('tacticsPanel').hidden=false};
$('closeTactics').onclick=()=>{$('tacticsPanel').hidden=true;paused=false;$('pause').textContent='일시정지'};

function evaluateTactics(a,allies,enemies){if(a.team!=='hero')return false;a.tacticCooldowns??={};const options=(equipped[a.name]||[]).map(id=>({id,t:TACTICS[id]})).filter(o=>!(a.tacticCooldowns[o.id]>0)).map(o=>({...o,score:o.t.score(a,allies,enemies)})).sort((x,y)=>y.score-x.score);const best=options[0];if(!best||best.score<60)return false;best.t.execute(a,allies,enemies);a.tacticCooldowns[best.id]=best.t.cooldown;a.timer=Math.max(a.timer,.5);return true}
function hit(a,b){if(b.dead)return;animation(a,'attack',true);const duration=a.current?.getClip().duration||.7;const windup=Math.max(.12,Math.min(.55,duration*(a.name==='Knight'?.42:.48)));pending.push({a,b,remaining:windup})}
function resolveAOE(a,b){if(a.dead)return;for(const enemy of actors.filter(e=>e.team!==a.team&&!e.dead&&e.pos.distanceTo(b.pos)<(tacticLevel('aoe')>=2?3.5:2.8)))applyDamage(a,enemy,'#8bc7ff',tacticLevel('aoe')>=3?1.35:1)}
function resolveAttack(a,b){if(a.dead||b.dead||!lineClear(a.pos,b.pos,.2))return;if(a.name==='Rogue_Hooded')projectile(a,b,'arrow');else if(a.name==='Mage'||a.name==='Skeleton_Mage')projectile(a,b,'spell');else applyDamage(a,b,a.team==='hero'?'#ffe29b':'#ff8181')}
function updateEffects(dt){for(let i=pending.length-1;i>=0;i--){const p=pending[i];p.remaining-=dt;if(p.remaining<=0){pending.splice(i,1);p.aoe?resolveAOE(p.a,p.b):resolveAttack(p.a,p.b)}}for(let i=shots.length-1;i>=0;i--){const p=shots[i];p.age+=dt;const t=Math.min(1,p.age/p.duration);p.core.position.lerpVectors(p.start,p.end,t);if(p.kind==='spell'){p.core.scale.setScalar(1+Math.sin(t*Math.PI)*.6);p.core.rotation.y+=dt*8}if(p.glow)p.glow.position.copy(p.core.position);if(t>=1){scene.remove(p.core);if(p.glow)scene.remove(p.glow);shots.splice(i,1);if(!p.target.dead)applyDamage(p.attacker,p.target,p.kind==='spell'?'#8bc7ff':'#ffe29b')}}for(let i=impacts.length-1;i>=0;i--){const p=impacts[i];p.age+=dt;const t=Math.min(1,p.age/p.duration);if(p.velocity)p.mesh.position.addScaledVector(p.velocity,dt);else p.mesh.scale.setScalar(1+t*6);p.mesh.material.opacity=1-t;if(t>=1){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();impacts.splice(i,1)}}shake=Math.max(0,shake-dt*.65);flash=Math.max(0,flash-dt)}
function update(dt){if(!ready||paused||finished)return;updateEffects(dt);for(const a of actors){a.mixer.update(dt);a.ring.position.x=a.pos.x;a.ring.position.z=a.pos.z;if(a.dead){a.dying=(a.dying||0)+dt;if(a.dying>.7){a.root.position.y-=dt*1.1;a.root.scale.multiplyScalar(Math.max(.1,1-dt*1.7));if(a.dying>1.25)a.root.visible=false}continue}if(a.knockback>0){const d=Math.min(a.knockback,dt);a.knockback-=d;const nx=THREE.MathUtils.clamp(a.pos.x+a.knockDirection.x*d*3,-7.5,7.5),nz=THREE.MathUtils.clamp(a.pos.z+a.knockDirection.z*d*3,-5.5,5.5);a.pos.set(nx,0,nz);a.root.position.x=nx;a.root.position.z=nz}a.root.position.y=THREE.MathUtils.lerp(a.root.position.y,0,Math.min(1,dt*12));if(a.stagger>0){a.stagger-=dt;continue}for(const k in a.tacticCooldowns||{})a.tacticCooldowns[k]=Math.max(0,a.tacticCooldowns[k]-dt);a.tauntTime=Math.max(0,(a.tauntTime||0)-dt);a.guardTime=Math.max(0,(a.guardTime||0)-dt);a.focusTime=Math.max(0,(a.focusTime||0)-dt);a.kiteBonusTime=Math.max(0,(a.kiteBonusTime||0)-dt);a.retreatTime=Math.max(0,(a.retreatTime||0)-dt);const enemies=actors.filter(b=>b.team!==a.team&&!b.dead);if(!enemies.length)continue;const allies=actors.filter(b=>b.team===a.team&&!b.dead);a.timer-=dt;if(a.timer<=0&&evaluateTactics(a,allies,enemies))continue;if(a.retreatTime>0&&a.retreat){move(a,a.retreat,dt);continue}let target=(a.tauntTime>0&&!a.tauntedBy?.dead&&a.tauntedBy?.team!==a.team)?a.tauntedBy:null;if(!target&&a.focusTime>0&&!a.focus?.dead)target=a.focus;if(!target)target=a.team==='enemy'?monsterTarget(a,enemies):enemies.reduce((best,b)=>!best||b.pos.distanceToSquared(a.pos)<best.pos.distanceToSquared(a.pos)?b:best,null);a.target=target;look(a,target);const dist=a.pos.distanceTo(target.pos);if(dist>a.range||!lineClear(a.pos,target.pos,.2)){const desired=target.pos.clone().addScaledVector(a.pos.clone().sub(target.pos).normalize(),a.range*.78);move(a,desired,dt)}else{if(a.timer<=0){hit(a,target);a.timer=a.cooldown}else if(a.anim==='walk')animation(a,'idle')}}const heroes=actors.filter(a=>a.team==='hero'&&!a.dead),foes=actors.filter(a=>a.team==='enemy'&&!a.dead);if(!heroes.length||!foes.length){finished=true;if(heroes.length){progress.wins++;progress.gold+=10+progress.stage*5;if(progress.farming){progress.farming=false;progress.stage=progress.highestStage}else{progress.stage++;progress.highestStage=Math.max(progress.highestStage,progress.stage)}saveTactics()}else{progress.farming=true;progress.stage=Math.max(1,progress.highestStage-1);saveTactics()}$('notice').textContent=heroes.length?'VICTORY · GOLD +'+(10+(progress.farming?progress.stage:progress.stage-1)*5):'DEFEAT';renderProgress();$('restart').disabled=false;queueNextBattle()}renderHP()}
function renderHP(){for(const a of actors.filter(a=>a.team==='hero')){const bar=$('hp-'+a.name);if(bar)bar.style.width=(a.hp/a.max*100)+'%'}}
function resize(){const w=game.clientWidth,h=game.clientHeight;renderer.setSize(w,h);const aspect=w/h;const halfH=aspect<.8?13:10;camera.left=-halfH*aspect;camera.right=halfH*aspect;camera.top=halfH;camera.bottom=-halfH;camera.position.set(13,19,21);camera.lookAt(0,0,0);camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
async function start(){clearTimeout(nextBattleTimer);room();ready=false;finished=false;paused=false;$('tacticsPanel').hidden=true;$('upgradePanel').hidden=true;$('pause').textContent='일시정지';$('restart').disabled=true;$('notice').textContent='';for(const a of actors){scene.remove(a.root);scene.remove(a.ring);clearTimeout(a.animTimeout)}for(const p of shots){scene.remove(p.core);if(p.glow)scene.remove(p.glow)}shots.length=0;pending.length=0;for(const p of impacts)scene.remove(p.mesh);impacts.length=0;actors=[];try{await Promise.all([spawn('Knight','hero',-3,2.1,Math.round(115*(1+progress.upgrades.health*.15)),Math.round(19*(1+progress.upgrades.attack*.12)),1.5,.9),spawn('Rogue_Hooded','hero',-1.4,3.2,Math.round(78*(1+progress.upgrades.health*.15)),Math.round(13*(1+progress.upgrades.attack*.12)),5,1.15),spawn('Mage','hero',.5,3.4,Math.round(75*(1+progress.upgrades.health*.15)),Math.round(11*(1+progress.upgrades.attack*.12)),5.5,1.3),spawn('Skeleton_Warrior','enemy',-1,-3,Math.round(65*(1+(progress.stage-1)*.12)),Math.round(10*(1+(progress.stage-1)*.065)),1.45,1.3),spawn('Skeleton_Warrior','enemy',1.4,-3.4,Math.round(65*(1+(progress.stage-1)*.12)),Math.round(10*(1+(progress.stage-1)*.065)),1.45,1.3).then(a=>{a.behavior='hunter'}),spawn('Skeleton_Mage','enemy',3,-2.2,Math.round(55*(1+(progress.stage-1)*.12)),Math.round(12*(1+(progress.stage-1)*.065)),4.8,1.7)]);$('party').innerHTML=actors.filter(a=>a.team==='hero').map(a=>'<div class="card"><div class="name"><span>'+({Knight:'전사',Rogue_Hooded:'궁수',Mage:'마법사'}[a.name])+'</span><span>'+a.max+' HP</span></div><div class="hp"><span id="hp-'+a.name+'"></span></div></div>').join('');renderProgress();ready=true}catch(e){console.error(e);$('error').style.display='block';$('error').textContent='KayKit 모델 로드 실패: '+e.message+'\nGitHub Actions의 에셋 설치 결과를 확인하세요.';$('status').textContent='에셋 오류'}}
$('speed').onclick=()=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];$('speed').textContent=speed+'×'};$('restart').onclick=start;$('pause').onclick=()=>{if(!$('upgradePanel').hidden||!$('tacticsPanel').hidden)return;paused=!paused;$('pause').textContent=paused?'계속':'일시정지'};
function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-last)/1000,.05)*speed;last=t;update(dt);if(shake>0){camera.position.x=13+(Math.random()-.5)*shake;camera.position.y=19+(Math.random()-.5)*shake;camera.position.z=21+(Math.random()-.5)*shake}else camera.position.set(13,19,21);renderer.render(scene,camera)}requestAnimationFrame(frame);start();
</script></body></html>
