<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJ_I — Expedition</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10141c;color:#edf2f8;font:14px system-ui,sans-serif}header{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#192232;border-bottom:1px solid #334259}h1{font-size:19px;margin:0}button{border:1px solid #58729c;border-radius:7px;background:#304d7b;color:#fff;padding:9px 12px;cursor:pointer}button:disabled{opacity:.45}button:hover:not(:disabled){background:#446ba7}.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;height:calc(100vh - 55px)}#stage{position:relative;overflow:hidden;background:#121b27}canvas{display:block}#overlay{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.chip{background:#172335d9;border:1px solid #4c6080;border-radius:8px;padding:8px 10px}aside{overflow:auto;background:#1b2534;border-left:1px solid #34445c;padding:15px}.panel{margin-bottom:18px}h2{font-size:15px;margin:0 0 10px;color:#bcd2f6}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #354257}.row small{color:#9cb0c8}.log{height:180px;overflow:auto;background:#101925;padding:9px;border-radius:8px;font-size:12px;line-height:1.65}.log div{border-bottom:1px solid #27374c}.bar{height:9px;background:#465066;border-radius:10px;overflow:hidden;margin:5px 0}.fill{height:100%;background:#65d18a}.actions{display:flex;gap:6px;flex-wrap:wrap}.help{font-size:12px;color:#a8b7ca;line-height:1.6}.status{color:#f4cf8a}#fallback{display:none;padding:25px;color:#f6b3a8}@media(max-width:800px){.layout{height:auto;display:block}#stage{height:55vh;min-height:330px}aside{border-left:0}.log{height:120px}} </style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<header><h1>⚔ PROJ_I <small style="font-size:12px;color:#9ab0ce">3D Expedition Prototype</small></h1><div class="actions"><button id="start">탐험 시작</button><button id="retreat" disabled>귀환</button><button id="speed">속도 1×</button></div></header>
<div class="layout"><main id="stage"><div id="overlay"><span class="chip">🗺 발견 <b id="discovered">0</b>/10</span><span class="chip">🎒 <b id="bag">0</b>/<b id="cap">30</b></span><span class="chip">💰 <b id="gold">0</b></span><span class="chip status" id="state">대기 중</span></div><div id="fallback"></div></main><aside><section class="panel"><h2>파티</h2><div id="party"></div></section><section class="panel"><h2>영구 업그레이드</h2><div id="upgrades"></div></section><section class="panel"><h2>탐험 기록</h2><div id="report" class="help">탐험을 시작하세요.</div></section><section class="panel"><h2>탐험 로그</h2><div id="log" class="log"></div></section><section class="panel"><h2>조작</h2><p class="help">파티는 미탐색 방을 자동으로 찾아 이동합니다. 전사는 근접, 궁수는 원거리, 성직자는 회복합니다. 가방이 가득 차거나 파티가 전멸하면 귀환합니다. 브라우저에 성장이 자동 저장됩니다.</p><button id="reset">진행 초기화</button></section></aside></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),KEY='proj_i_3d_v1',N=10;
const rooms=[[-16,0],[-10,-7],[-3,-7],[4,-11],[4,0],[12,0],[18,-8],[18,8],[9,12],[-2,12]];
const edges=[[0,1],[1,2],[2,3],[2,4],[4,5],[5,6],[5,7],[7,8],[8,9],[9,0]];
const types=['start','enemy','chest','enemy','enemy','chest','camp','enemy','chest','boss'];
const upgrades=[['damage','무기','공격력 +3',30],['armor','방어구','최대 HP +18',30],['capacity','가방','운반량 +15',25],['scout','정찰','이동속도 +12%',35]];
const defaults=()=>({gold:0,best:0,runs:0,levels:{damage:0,armor:0,capacity:0,scout:0}});
let data;try{const old=JSON.parse(localStorage.getItem(KEY)||'null');data={...defaults(),...old,levels:{...defaults().levels,...old?.levels}}}catch{data=defaults()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),cost=(k,b)=>Math.ceil(b*Math.pow(1.55,data.levels[k]));
let scene,camera,renderer,clock,party=[],enemies=[],fx=[],floorTiles=[],chests=[],visited=new Set(),run=null,speed=1,phase='idle',targetRoom=0,combatTick=0,healingTick=0,roomTimer=0;
const v=(x,z)=>new THREE.Vector3(x,0,z),at=i=>v(...rooms[i]);
function addLog(s){const e=document.createElement('div');e.textContent=s;$('log').prepend(e);while($('log').children.length>65)$('log').lastChild.remove()}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.86})}
const materials={ground:mat(0x34434a),wall:mat(0x52616c),unknown:mat(0x131a25),path:mat(0x4d5a60),hero:mat(0x5d9ce4),archer:mat(0x78bb78),priest:mat(0xe9d69a),enemy:mat(0xc55d5d),boss:mat(0x994eac),chest:mat(0xb9823e),gold:mat(0xf4d46c)};
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function cylinder(r,h,m,x,y,z){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),m);o.position.set(x,y,z);scene.add(o);return o}
function actor(color,scale=1){const root=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.42*scale,.48*scale,1.05*scale,7),color);body.position.y=.78*scale;root.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.35*scale,10,8),mat(0xf1c7a2));head.position.y=1.52*scale;root.add(head);scene.add(root);return root}
function buildWorld(){scene=new THREE.Scene();scene.background=new THREE.Color(0x121b29);scene.fog=new THREE.Fog(0x121b29,36,80);scene.add(new THREE.HemisphereLight(0xb5d4ff,0x2b2924,2.3));const sun=new THREE.DirectionalLight(0xffe9c3,2.5);sun.position.set(-10,25,12);scene.add(sun);camera=new THREE.OrthographicCamera(-22,22,15,-15,.1,150);camera.position.set(28,36,35);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=false;$('stage').prepend(renderer.domElement);clock=new THREE.Clock();for(const [a,b] of edges){const A=at(a),B=at(b),delta=B.clone().sub(A),length=delta.length(),center=A.clone().add(B).multiplyScalar(.5);const tile=box(3,.13,length,materials.path,center.x,-.06,center.z);tile.rotation.y=Math.atan2(delta.x,delta.z);floorTiles.push({mesh:tile,rooms:[a,b]})}for(let i=0;i<N;i++){const [x,z]=rooms[i];const tile=box(5,.18,5,materials.ground,x,-.1,z);floorTiles.push({mesh:tile,rooms:[i]});for(let side=0;side<4;side++){if((i+side)%3===0)continue;const a=side*Math.PI/2,wx=x+Math.sin(a)*2.4,wz=z+Math.cos(a)*2.4;const wall=box(.8,1.1,.8,materials.wall,wx,.55,wz);floorTiles.push({mesh:wall,rooms:[i]})}if(types[i]==='chest'){const c=box(1,.8,.75,materials.chest,x+.8,.45,z+.8);chests.push({room:i,mesh:c})}}party=[{name:'전사',role:'warrior',obj:actor(materials.hero),hp:70,max:70,offset:v(-.8,.5),cool:0},{name:'궁수',role:'archer',obj:actor(materials.archer),hp:55,max:55,offset:v(.8,.6),cool:0},{name:'성직자',role:'priest',obj:actor(materials.priest),hp:55,max:55,offset:v(0,-.8),cool:0}];party.forEach(p=>p.obj.position.copy(at(0).add(p.offset)));resize();window.addEventListener('resize',resize);updateFog()}
function resize(){const el=$('stage');const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);const ratio=w/h;camera.left=-19*ratio;camera.right=19*ratio;camera.top=19;camera.bottom=-19;camera.updateProjectionMatrix()}
function updateFog(){for(const o of floorTiles){const known=o.rooms.every(r=>visited.has(r));o.mesh.visible=known}for(const c of chests)c.mesh.visible=visited.has(c.room)&&!c.opened}
function neighbors(i){return edges.flatMap(([a,b])=>a===i?[b]:b===i?[a]:[])}
function route(from,to){const queue=[[from]],seen=new Set([from]);while(queue.length){const path=queue.shift(),last=path.at(-1);if(last===to)return path;for(const n of neighbors(last)){if(!seen.has(n)){seen.add(n);queue.push([...path,n])}}}return [from]}
function renderUI(){const bag=run?.bag||0;$('bag').textContent=bag;$('cap').textContent=30+15*data.levels.capacity;$('gold').textContent=data.gold;$('discovered').textContent=visited.size;$('state').textContent=run?(phase==='fight'?'⚔ 전투 중':phase==='move'?'🧭 이동 중':'🔎 탐색 중'):'🏠 대기';$('start').disabled=!!run;$('retreat').disabled=!run;$('speed').textContent='속도 '+speed+'×';const partyEl=$('party');partyEl.replaceChildren();for(const p of party){const r=document.createElement('div');r.className='row';const left=document.createElement('span');left.textContent=p.name;const right=document.createElement('span');right.textContent=Math.ceil(p.hp)+'/'+p.max;right.style.color=p.hp>0?'#9de0ae':'#f18c8c';r.append(left,right);partyEl.append(r)}const up=$('upgrades');up.replaceChildren();for(const [key,label,desc,base] of upgrades){const row=document.createElement('div');row.className='row';const left=document.createElement('div');left.innerHTML='<strong>'+label+' Lv.'+data.levels[key]+'</strong><br><small>'+desc+'</small>';const btn=document.createElement('button');btn.textContent=cost(key,base)+'G';btn.disabled=!!run||data.gold<cost(key,base);btn.onclick=()=>{if(run||data.gold<cost(key,base))return;data.gold-=cost(key,base);data.levels[key]++;save();resetParty();renderUI()};row.append(left,btn);up.append(row)}}
function resetParty(){for(const p of party){p.max=(p.role==='warrior'?70:55)+data.levels.armor*18;p.hp=p.max;p.obj.visible=true;p.obj.position.copy(at(0).add(p.offset));p.cool=0}visited=new Set([0]);targetRoom=0;updateFog()}
function start(){if(run)return;resetParty();run={bag:0,loot:0,rooms:1,from:0,path:[],elapsed:0,battles:0};phase='choose';addLog('🚩 탐험대 출발');renderUI()}
function finish(reason){if(!run)return;const old=run;run=null;phase='idle';enemies.forEach(e=>scene.remove(e.obj));enemies=[];fx.forEach(f=>scene.remove(f.obj));fx=[];data.gold+=old.loot;data.best=Math.max(data.best,old.rooms);data.runs++;save();$('report').textContent=reason+' · 탐험 '+old.rooms+'/10방 · 전투 '+old.battles+'회 · 전리품 '+old.loot+'G';addLog('🏠 '+reason+' / '+old.loot+'G 정산');renderUI()}
function choose(){if(!run)return;const frontier=[...visited].flatMap(i=>neighbors(i).filter(j=>!visited.has(j)));if(!frontier.length){finish('던전 정복');return}const current=run.from;const destination=frontier.sort((a,b)=>route(current,a).length-route(current,b).length)[0];run.path=route(current,destination).slice(1);phase='move';nextWaypoint()}
function nextWaypoint(){if(!run)return;if(!run.path.length){phase='room';roomTimer=.65;return}targetRoom=run.path.shift();phase='move'}
function roomEvent(){if(!run)return;const room=targetRoom;visited.add(room);run.from=room;run.rooms=visited.size;updateFog();const type=types[room];if(type==='enemy'||type==='boss'){const boss=type==='boss';const count=boss?1:room>5?3:2;enemies=[];for(let i=0;i<count;i++){const obj=actor(boss?materials.boss:materials.enemy,boss?1.5:.85);obj.position.copy(at(room).add(v((i-(count-1)/2)*1.25,1.5)));enemies.push({obj,hp:boss?145:35+room*6,max:boss?145:35+room*6,damage:boss?16:5+Math.floor(room/2),cool:1+i*.2,boss})}phase='fight';addLog('⚔ '+room+'번 방: '+(boss?'던전 수호자':'몬스터 '+count+'마리'))}else if(type==='chest'){const amount=15+room*7;const taken=Math.min(amount,30+data.levels.capacity*15-run.bag);run.bag+=taken;run.loot+=taken;const c=chests.find(c=>c.room===room);if(c){c.opened=true;c.mesh.visible=false}addLog('💎 보물 '+taken+'G 획득');phase='choose'}else if(type==='camp'){for(const p of party)p.hp=Math.min(p.max,p.hp+30);addLog('⛺ 야영지에서 회복');phase='choose'}else phase='choose';if(run&&run.bag>=30+15*data.levels.capacity){finish('가방이 가득 차 귀환')}}
function particle(from,to,color,scale=.13){const o=new THREE.Mesh(new THREE.SphereGeometry(scale,8,6),new THREE.MeshBasicMaterial({color}));o.position.copy(from);scene.add(o);fx.push({obj:o,from:from.clone(),to:to.clone(),t:0,duration:.27})}
function battle(dt){if(!run)return;const alive=party.filter(p=>p.hp>0);const foes=enemies.filter(e=>e.hp>0);if(!foes.length){enemies.forEach(e=>scene.remove(e.obj));enemies=[];run.battles++;const gold=8+targetRoom*4;const taken=Math.min(gold,30+15*data.levels.capacity-run.bag);run.bag+=taken;run.loot+=taken;addLog('🏆 승리! '+taken+'G 획득');phase='choose';if(run.bag>=30+15*data.levels.capacity)finish('가방이 가득 차 귀환');return}if(!alive.length){finish('파티 전멸');return}for(const p of alive){p.cool-=dt;const foe=foes.find(e=>e.hp>0);if(!foe)break;const dir=foe.obj.position.clone().sub(p.obj.position);dir.y=0;const distance=dir.length(),range=p.role==='warrior'?1.6:6;if(p.role==='warrior'&&distance>range){p.obj.position.addScaledVector(dir.normalize(),Math.min(distance-range,dt*3));continue}if(p.cool<=0){p.cool=p.role==='warrior'?.8:p.role==='archer'?1.15:1.35;if(p.role==='priest'){const patient=alive.slice().sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(patient&&patient.hp<patient.max){patient.hp=Math.min(patient.max,patient.hp+12);particle(p.obj.position.clone().add(v(0,0).setY(1.3)),patient.obj.position.clone().setY(1.2),0x7bff9a,.2)}else{foe.hp-=4;particle(p.obj.position.clone().setY(1.3),foe.obj.position.clone().setY(1),0xffe69a)}}else{const damage=(p.role==='warrior'?12:9)+3*data.levels.damage;foe.hp-=damage;particle(p.obj.position.clone().setY(1.1),foe.obj.position.clone().setY(1.1),p.role==='archer'?0xf8d66c:0xffffff,.17);foe.obj.scale.setScalar(foe.hp>0?1.12:0.1)}if(foe.hp<=0){foe.obj.visible=false;addLog('💥 '+(foe.boss?'보스':'몬스터')+' 처치')}}}for(const e of foes){if(e.hp<=0)continue;e.cool-=dt;const victim=alive.filter(p=>p.hp>0).sort((a,b)=>a.obj.position.distanceTo(e.obj.position)-b.obj.position.distanceTo(e.obj.position))[0];if(!victim)break;const dist=e.obj.position.distanceTo(victim.obj.position);if(dist>1.5){const d=victim.obj.position.clone().sub(e.obj.position);d.y=0;e.obj.position.addScaledVector(d.normalize(),Math.min(dt*2,dist-1.5))}else if(e.cool<=0){e.cool=e.boss?1.25:1.7;victim.hp=Math.max(0,victim.hp-e.damage);particle(e.obj.position.clone().setY(1.2),victim.obj.position.clone().setY(1.2),0xff6262);if(victim.hp===0){victim.obj.visible=false;addLog('☠ '+victim.name+' 쓰러짐')}}}}
function update(dt){if(!run)return;run.elapsed+=dt;if(phase==='choose')choose();else if(phase==='move'){const dest=at(targetRoom);let arrived=true;for(const p of party){if(p.hp<=0)continue;const goal=dest.clone().add(p.offset),diff=goal.clone().sub(p.obj.position);diff.y=0;if(diff.length()>.12){arrived=false;p.obj.position.addScaledVector(diff.normalize(),Math.min(diff.length(),dt*(3+data.levels.scout*.45)))}}if(arrived)nextWaypoint()}else if(phase==='room'){roomTimer-=dt;if(roomTimer<=0)roomEvent()}else if(phase==='fight')battle(dt);combatTick+=dt;if(combatTick>.25){combatTick=0;renderUI()}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta()*speed,.12);update(dt);for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const t=Math.min(1,f.t/f.duration);f.obj.position.lerpVectors(f.from,f.to,t);f.obj.position.y+=Math.sin(t*Math.PI)*.08;if(t>=1){scene.remove(f.obj);fx.splice(i,1)}}if(run){const center=party.filter(p=>p.hp>0).reduce((acc,p,_,arr)=>acc.add(p.obj.position.clone().multiplyScalar(1/arr.length)),new THREE.Vector3());const wanted=center.clone().add(v(18,23).setY(25));camera.position.lerp(wanted,.035);camera.lookAt(center)}renderer.render(scene,camera)}
$('start').onclick=start;$('retreat').onclick=()=>finish('수동 귀환');$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;renderUI()};$('reset').onclick=()=>{if(!confirm('저장된 진행도를 초기화할까요?'))return;if(run)finish('초기화');data=defaults();save();resetParty();renderUI()};
try{buildWorld();resetParty();renderUI();addLog('준비 완료. 탐험 시작을 누르세요.');animate()}catch(error){$('fallback').style.display='block';$('fallback').textContent='3D 초기화 실패: '+error.message;console.error(error)}
</script></body></html>
