*{box-sizing:border-box}body{margin:0;background:#090e17;color:#f1eee5;font:14px system-ui,sans-serif;overflow:hidden}#game{position:relative;width:100vw;height:100dvh;overflow:hidden}#game canvas{display:block}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:12px;pointer-events:none}#title{font-size:15px;font-weight:900;letter-spacing:.12em;color:#f0d59d;text-shadow:0 2px 6px #000}#status{font-size:12px;color:#e2e7ef;background:#111a29c9;padding:8px 11px;border:1px solid #465267;border-radius:9px}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;display:flex;flex-direction:column;gap:8px}.party{display:flex;gap:6px}.card{flex:1;min-width:0;background:#121b2bdc;border:1px solid #4a576b;border-radius:9px;padding:8px}.name{font-size:12px;font-weight:750;display:flex;justify-content:space-between;gap:3px}.hp{height:5px;border-radius:6px;background:#3c2630;margin-top:6px;overflow:hidden}.hp span{display:block;height:100%;background:#67c78a;width:100%;transition:width .2s}.card.dead{opacity:.55}.action{margin-top:5px;font-size:10px;color:#f0d59d;min-height:13px}#battleInfo{position:absolute;top:calc(env(safe-area-inset-top) + 53px);right:12px;background:#111a29d9;border:1px solid #465267;border-radius:8px;padding:6px 9px;font-size:11px;color:#dce7f2;pointer-events:none}.buttons{display:flex;justify-content:center;gap:8px}button{background:#c99a57;color:#16171a;border:0;border-radius:9px;padding:11px 22px;font-weight:800;cursor:pointer}button.secondary{background:#29374a;color:#e2e7ef}#notice{position:absolute;left:50%;top:19%;transform:translateX(-50%);font-size:22px;font-weight:900;text-shadow:0 2px 8px #000;text-align:center;pointer-events:none;white-space:nowrap}#tacticsPanel{position:absolute;inset:9% 10px auto;max-height:72dvh;overflow:auto;background:#101a2cf5;border:1px solid #9c815a;border-radius:12px;padding:14px;z-index:8;box-shadow:0 10px 40px #000b}#tacticsPanel[hidden]{display:none}#tacticsPanel h2{margin:0 0 8px;color:#f0d59d;font-size:18px}.trow{border-top:1px solid #45516a;padding:9px 0}.trow h3{margin:0 0 6px;font-size:14px}.tchoices{display:flex;gap:5px;flex-wrap:wrap}.tchoices button{padding:7px 9px;font-size:12px;background:#26364d;color:#eee;border:1px solid #4b617a}.tchoices button.active{background:#a57840;color:#fff;border-color:#f0d59d}.tchoices button:disabled{opacity:.4}.panelFoot{font-size:12px;color:#b9c7d8;margin:8px 0}#upgradePanel{position:absolute;inset:9% 10px auto;max-height:72dvh;overflow:auto;background:#101a2cf5;border:1px solid #9c815a;border-radius:12px;padding:14px;z-index:8}#upgradePanel[hidden]{display:none}.upgradeRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid #465267}.upgradeRow button{padding:8px 10px;font-size:12px}.upgradeRow button:disabled{opacity:.45}#error{display:none;position:absolute;inset:20% 12px auto;padding:16px;background:#411b20f0;border:1px solid #e17575;border-radius:10px;white-space:pre-wrap;z-index:10}.float{position:absolute;z-index:3;font-size:21px;font-weight:900;pointer-events:none;text-shadow:0 2px 5px #000;animation:pop .75s forwards}@keyframes pop{to{transform:translateY(-44px);opacity:0}}@media(min-width:800px){#bottom{max-width:560px;left:50%;right:auto;width:90%;transform:translateX(-50%)}#title{font-size:20px}}
